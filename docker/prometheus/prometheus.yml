# Configuración de recolección de métricas de Prometheus
global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  # Balanceo de carga de la API: etiquetas instance diferenciadas para comparar api1 y api2
  - job_name: 'api'
    metrics_path: /metrics
    static_configs:
      - targets: ['api1:8080']
        labels:
          instance: 'api1'
      - targets: ['api2:8080']
        labels:
          instance: 'api2'

  # Servicio en segundo plano (Worker): expone /metrics en el puerto 9464
  - job_name: 'worker'
    metrics_path: /metrics
    static_configs:
      - targets: ['worker:9464']
        labels:
          instance: 'worker'

  # Broker de mensajería RabbitMQ (plugin rabbitmq_prometheus en puerto 15692)
  - job_name: 'rabbitmq'
    metrics_path: /metrics
    static_configs:
      - targets: ['rabbitmq:15692']
        labels:
          instance: 'rabbitmq'

