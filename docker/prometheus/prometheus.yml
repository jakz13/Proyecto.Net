# Prometheus: lee las métricas de cada servicio cada 15 segundos (red interna de Docker).
global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  # API: dos instancias con etiqueta propia para comparar el reparto del balanceador
  - job_name: api
    metrics_path: /metrics
    static_configs:
      - targets: ["api1:8080"]
        labels: { instancia: api1 }
      - targets: ["api2:8080"]
        labels: { instancia: api2 }

  - job_name: worker
    metrics_path: /metrics
    static_configs:
      - targets: ["worker:9464"]

  # Cola de mensajes (plugin rabbitmq_prometheus)
  - job_name: rabbitmq
    static_configs:
      - targets: ["rabbitmq:15692"]

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
