services:
  postgres:
    image: postgres:16-alpine
    container_name: ultimamilla-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ultimamilla
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ultimamilla"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: ultimamilla-redis
    restart: unless-stopped
    ports:
      - "6379:6379"

  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: ultimamilla-rabbitmq
    restart: unless-stopped
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest

  api:
    build:
      context: .
      dockerfile: src/Api/Dockerfile
    container_name: ultimamilla-api
    restart: unless-stopped
    ports:
      - "5000:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_HTTP_PORTS=8080
      - ConnectionStrings__DefaultConnection=Host=postgres;Port=5432;Database=ultimamilla;Username=postgres;Password=postgres
    depends_on:
      postgres:
        condition: service_healthy

  backoffice:
    build:
      context: .
      dockerfile: src/Web/Backoffice/Dockerfile
    container_name: ultimamilla-backoffice
    restart: unless-stopped
    ports:
      - "5002:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_HTTP_PORTS=8080
      - ApiSettings__BaseUrl=http://api:8080
    depends_on:
      - api

  portal-comercio:
    build:
      context: .
      dockerfile: src/Web/PortalComercio/Dockerfile
    container_name: ultimamilla-portal-comercio
    restart: unless-stopped
    ports:
      - "5003:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_HTTP_PORTS=8080
      - ApiSettings__BaseUrl=http://api:8080
    depends_on:
      - api

volumes:
  postgres_data:
