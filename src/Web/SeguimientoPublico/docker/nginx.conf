server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # El runtime de Blazor WebAssembly pesa varios MB: se comprime en tránsito
    gzip on;
    gzip_min_length 1024;
    gzip_types application/wasm application/json application/javascript text/css application/octet-stream;

    # La configuración (URL de la API) nunca se cachea
    location = /appsettings.json {
        add_header Cache-Control "no-store, no-cache, must-revalidate";
    }

    # Aplicación de una sola página: cualquier ruta que no sea un archivo devuelve index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
