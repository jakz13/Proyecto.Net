name: CI/CD

on:
  push:
    branches: [ "main", "master", "develop" ]
  pull_request:
    branches: [ "main", "master", "develop" ]
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    # Las pruebas de integración necesitan Postgres en localhost:5432 (usuario y clave postgres/postgres, como en docker-compose)
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: dotnet restore UltimaMilla.Backend.slnf

      - name: Build solution
        run: dotnet build UltimaMilla.Backend.slnf --no-restore --configuration Release

      # Dependencias con vulnerabilidades conocidas: falla el pipeline si aparece alguna de gravedad alta o crítica
      - name: Auditar paquetes vulnerables
        run: |
          dotnet list UltimaMilla.Backend.slnf package --vulnerable --include-transitive 2>&1 | tee vulnerables.txt
          if grep -E "^\s+>.*\s(High|Critical)\s" vulnerables.txt; then
            echo "Hay paquetes con vulnerabilidades altas o críticas."; exit 1
          fi

      # Todas las pruebas (dominio, aplicación, arquitectura, integración y aislamiento entre inquilinos) con medición de cobertura
      - name: Run automated tests
        run: dotnet test UltimaMilla.Backend.slnf --no-build --configuration Release --verbosity normal --collect:"XPlat Code Coverage" --results-directory ./resultados-pruebas

      # Cobertura de las capas de dominio y aplicación (requerimiento opcional: superior al 70 %), con reporte publicado por el pipeline
      - name: Reporte de cobertura
        run: |
          dotnet tool install --global dotnet-reportgenerator-globaltool
          reportgenerator -reports:"resultados-pruebas/**/coverage.cobertura.xml" -targetdir:cobertura -reporttypes:"Html;TextSummary;MarkdownSummaryGithub" -assemblyfilters:"+UltimaMilla.Domain;+UltimaMilla.Application"
          cat cobertura/SummaryGithub.md >> "$GITHUB_STEP_SUMMARY"
          LINEAS=$(grep -oP 'Line coverage: \K[0-9.]+' cobertura/Summary.txt | head -1)
          echo "Cobertura de líneas (dominio + aplicación): ${LINEAS}%"
          awk -v c="$LINEAS" 'BEGIN { if (c+0 < 70) { print "La cobertura es inferior al 70 %"; exit 1 } }'

      - name: Publicar reporte de cobertura
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cobertura
          path: cobertura

  # Entrega continua: solo se despliega al fusionar en main y únicamente si compiló y las pruebas pasaron.
  # Requiere los secretos del repositorio VM_HOST (IP de la VM) y VM_SSH_KEY (clave privada SSH autorizada en la VM).
  desplegar:
    needs: build-and-test
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: produccion
    # Un solo despliegue a la vez: si llegan dos pushes seguidos, el segundo espera al primero
    concurrency:
      group: despliegue-produccion
      cancel-in-progress: false

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Preparar clave SSH
        env:
          VM_SSH_KEY: ${{ secrets.VM_SSH_KEY }}
        run: |
          if [ -z "$VM_SSH_KEY" ]; then echo "Falta el secreto VM_SSH_KEY"; exit 1; fi
          install -m 700 -d ~/.ssh
          printf '%s\n' "$VM_SSH_KEY" > ~/.ssh/clave_vm
          chmod 600 ~/.ssh/clave_vm

      - name: Desplegar en Azure
        env:
          VM_HOST: ${{ secrets.VM_HOST }}
        run: |
          export VM_CLAVE_SSH="$HOME/.ssh/clave_vm"
          bash scripts/desplegar.sh
