name: CI

on:
  push:
    branches: [ "main", "master", "develop" ]
  pull_request:
    branches: [ "main", "master", "develop" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: dotnet restore UltimaMilla.sln

      - name: Build solution
        run: dotnet build UltimaMilla.sln --no-restore --configuration Release

      - name: Run automated tests
        run: dotnet test UltimaMilla.sln --no-build --configuration Release --verbosity normal
